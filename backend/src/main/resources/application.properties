spring.application.name=backend

# Load the monorepo root .env file.
# - file:.env: running Gradle from the repository root
# - file:../.env: running Gradle from the backend directory
# OS environment variables still take precedence over values loaded here.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server
server.address=${BACKEND_HOST:0.0.0.0}
server.port=${BACKEND_PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gordi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:gordi}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}
jwt.room-token-expiration=${JWT_ROOM_TOKEN_EXPIRATION:3600000}
cookie.secure=${COOKIE_SECURE:false}

# Room
room.expiration=${ROOM_EXPIRATION:7200000}
room.disconnect-grace-period=${ROOM_DISCONNECT_GRACE_PERIOD:15000}

# LiveKit
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:livekit-local-dev-secret-at-least-32-bytes}
livekit.server-url=${LIVEKIT_SERVER_URL:ws://localhost:7880}
livekit.token-expiration=${LIVEKIT_TOKEN_EXPIRATION:600000}
livekit.room-name-prefix=${LIVEKIT_ROOM_NAME_PREFIX:gordi-room-}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (used when the Redis starter is added)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# RabbitMQ (used when the AMQP starter is added)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_DEFAULT_VHOST:/}

# Jackson
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Image CDN base URL
gordi.image.base-url=${BASE_URL:}

# FastAPI Internal API
# internal-api-key 는 Spring -> FastAPI 호출과 FastAPI -> Spring 콜백(/internal/**) 양방향에
# 같은 공유 비밀로 쓰인다. 비워두면 양쪽 다 검증하지 않는다.
gordi.ai.base-url=${AI_INTERNAL_BASE_URL:http://localhost:8000}
gordi.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:2000}
gordi.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:5000}
gordi.ai.internal-api-key=${INTERNAL_API_KEY:}

# GET /api/v1/recommendation-options
gordi.recommendation.budget.min-allowed=0
gordi.recommendation.budget.max-allowed=5000000
gordi.recommendation.budget.currency=KRW
gordi.recommendation.budget.step=10000
gordi.recommendation.result-count=12
gordi.recommendation.candidate-pool-size=200
gordi.recommendation.schema-version=2.0

# /api/v1/try-on-jobs
gordi.try-on.daily-limit=${TRY_ON_DAILY_LIMIT:20}
gordi.try-on.poll-after-ms=${TRY_ON_POLL_AFTER_MS:1500}
gordi.try-on.max-items=${TRY_ON_MAX_ITEMS:5}

# internal API
gordi.try-on.reconcile.enabled=${TRY_ON_RECONCILE_ENABLED:true}
gordi.try-on.reconcile.interval-ms=${TRY_ON_RECONCILE_INTERVAL_MS:30000}
gordi.try-on.reconcile.stale-after-ms=${TRY_ON_RECONCILE_STALE_AFTER_MS:120000}
gordi.try-on.reconcile.batch-size=${TRY_ON_RECONCILE_BATCH_SIZE:20}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/v3/api-docs

# server proxy forwarding
server.forward-headers-strategy=framework

# OAuth2 - Kakao
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/api/v1/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

oauth2.redirect-url=${OAUTH2_REDIRECT_URL:http://localhost:5173/oauth/callback}
oauth2.failure-redirect-url=${OAUTH2_FAILURE_REDIRECT_URL:http://localhost:5173/login?error=oauth}

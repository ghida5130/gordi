spring.application.name=backend

# Load the monorepo root .env file.
# - file:.env: running Gradle from the repository root
# - file:../.env: running Gradle from the backend directory
# OS environment variables still take precedence over values loaded here.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Server
server.address=${BACKEND_HOST:0.0.0.0}
server.port=${BACKEND_PORT:8080}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gordi}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:gordi}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}
jwt.room-token-expiration=${JWT_ROOM_TOKEN_EXPIRATION:3600000}

# Room
room.expiration=${ROOM_EXPIRATION:7200000}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (used when the Redis starter is added)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# RabbitMQ (used when the AMQP starter is added)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_DEFAULT_VHOST:/}

# Jackson
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# FastAPI Internal API
gordi.ai.base-url=${AI_INTERNAL_BASE_URL:http://localhost:8000}
gordi.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:2000}
gordi.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:5000}
gordi.ai.internal-api-key=${INTERNAL_API_KEY:}

# GET /api/v1/recommendation-options
gordi.recommendation.budget.min-allowed=0
gordi.recommendation.budget.max-allowed=5000000
gordi.recommendation.budget.currency=KRW
gordi.recommendation.budget.step=10000
gordi.recommendation.result-count=12
gordi.recommendation.candidate-pool-size=200
gordi.recommendation.schema-version=2.0

# Swagger / OpenAPI
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.api-docs.path=/api/v3/api-docs

# server proxy forwarding
server.forward-headers-strategy=framework

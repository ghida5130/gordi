spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-key-for-ci-only-needs-32bytes-minimum
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000
jwt.room-token-expiration=3600000

# LivekitTokenProvider 는 기본값 없이 주입받으므로 테스트 설정에도 있어야 컨텍스트가 뜬다.
# api-secret 은 JJWT HMAC 서명을 위해 32바이트 이상이어야 한다.
livekit.api-key=devkey
livekit.api-secret=livekit-test-secret-at-least-32-bytes-long
livekit.server-url=ws://localhost:7880
livekit.token-expiration=600000
livekit.room-name-prefix=gordi-room-

spring.security.oauth2.client.registration.kakao.client-id=dummy
spring.security.oauth2.client.registration.kakao.client-secret=dummy

oauth2.redirect-url=http://localhost:5173/oauth/callback
oauth2.failure-redirect-url=http://localhost:5173/login?error=oauth

spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/api/v1/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# LiveKit
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:livekit-local-dev-secret-at-least-32-bytes}
livekit.server-url=${LIVEKIT_SERVER_URL:ws://localhost:7880}
livekit.token-expiration=${LIVEKIT_TOKEN_EXPIRATION:600000}
livekit.room-name-prefix=${LIVEKIT_ROOM_NAME_PREFIX:gordi-room-}
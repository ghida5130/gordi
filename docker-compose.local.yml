name: ${COMPOSE_PROJECT_NAME:-gordi}-app

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gordi-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=gordi-mysql 
      - REDIS_HOST=gordi-redis
      - RABBITMQ_HOST=gordi-rabbitmq
    networks:
      - app-network
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gordi-frontend
    restart: unless-stopped
    networks:
      - app-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: gordi-ai
    restart: unless-stopped
    environment:
      - ENVIRONMENT=prod
      - API_PREFIX=/ai/v1
    networks:
      - app-network
  
  livekit:
    image: livekit/livekit-server:latest
    container_name: gordi-livekit
    restart: unless-stopped
    environment:
      # Backend의 application.properties와 동일한 API key/secret을 사용한다.
      # 루트 .env에 값이 없을 때도 두 서비스의 로컬 기본값이 일치한다.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
        keys:
          "${LIVEKIT_API_KEY:-devkey}": "${LIVEKIT_API_SECRET:-livekit-local-dev-secret-at-least-32-bytes}"
    command: --bind 0.0.0.0
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - app-network
  
  # 🚀 로컬용 Nginx 서비스 추가
  nginx:
    image: nginx:alpine
    container_name: gordi-nginx
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
      external: true

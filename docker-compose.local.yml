name: ${COMPOSE_PROJECT_NAME:-gordi}-app

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gordi-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=gordi-mysql
      - REDIS_HOST=gordi-redis
      - RABBITMQ_HOST=gordi-rabbitmq
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gordi-frontend
    restart: unless-stopped
    networks:
      - app-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: gordi-ai
    restart: unless-stopped
    environment:
      - ENVIRONMENT=prod
      - API_PREFIX=/ai/v1
    networks:
      - app-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: gordi-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7881:7881"
      - "50300-50400:50300-50400/udp"
    networks:
      - app-network

  # 🚀 로컬용 Nginx 서비스 추가
  nginx:
    image: nginx:alpine
    container_name: gordi-nginx
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true

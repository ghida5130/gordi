name: ${COMPOSE_PROJECT_NAME:-gordi}-app

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gordi-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - AI_INTERNAL_BASE_URL=http://gordi-ai:8000
      - MYSQL_HOST=gordi-mysql 
      - REDIS_HOST=gordi-redis
      - RABBITMQ_HOST=gordi-rabbitmq
    networks:
      - app-network
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gordi-frontend
    restart: unless-stopped
    networks:
      - app-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: gordi-ai
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      API_PREFIX: /ai/v1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-2}
      OPENROUTER_EMBEDDING_DIMENSIONS: ${OPENROUTER_EMBEDDING_DIMENSIONS:-768}
      OPENROUTER_EMBEDDING_ENDPOINT: ${OPENROUTER_EMBEDDING_ENDPOINT:-https://openrouter.ai/api/v1/embeddings}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-Gordi AI}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      CATALOG_EMBEDDING_INDEX_PATH: ${CATALOG_EMBEDDING_INDEX_PATH:-/app/catalog_index/catalog-embeddings.json}
      RECOMMENDATION_IMAGE_ALLOWED_HOSTS: ${RECOMMENDATION_IMAGE_ALLOWED_HOSTS:-["localhost","gordi-nginx"]}
      ENABLE_RECOMMENDATION_DEMO: ${ENABLE_RECOMMENDATION_DEMO:-false}
      RECOMMENDATION_VLM_MODEL: ${RECOMMENDATION_VLM_MODEL:-openai/gpt-5.6-luna}
      RECOMMENDATION_VLM_ENDPOINT: ${RECOMMENDATION_VLM_ENDPOINT:-https://openrouter.ai/api/v1/chat/completions}
      RECOMMENDATION_VLM_API_KEY: ${RECOMMENDATION_VLM_API_KEY:-}
      RECOMMENDATION_VLM_TIMEOUT_SECONDS: ${RECOMMENDATION_VLM_TIMEOUT_SECONDS:-20}
      RECOMMENDATION_IMAGE_ATTRIBUTES_ENABLED: ${RECOMMENDATION_IMAGE_ATTRIBUTES_ENABLED:-false}
      RECOMMENDATION_VLM_RERANK_ENABLED: ${RECOMMENDATION_VLM_RERANK_ENABLED:-false}
      RECOMMENDATION_VLM_RERANK_TOP_K: ${RECOMMENDATION_VLM_RERANK_TOP_K:-20}
      RECOMMENDATION_VLM_RERANK_CONCURRENCY: ${RECOMMENDATION_VLM_RERANK_CONCURRENCY:-8}
      RECOMMENDATION_VLM_REASONING_EFFORT: ${RECOMMENDATION_VLM_REASONING_EFFORT:-low}
      RECOMMENDATION_LLM_REASONS_ENABLED: ${RECOMMENDATION_LLM_REASONS_ENABLED:-false}
      RECOMMENDATION_RANK_VECTOR_ENABLED: ${RECOMMENDATION_RANK_VECTOR_ENABLED:-true}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TRYON_IMAGE_MODEL: ${TRYON_IMAGE_MODEL:-google/gemini-3-pro-image}
      TRYON_GENERATION_TIMEOUT_SECONDS: ${TRYON_GENERATION_TIMEOUT_SECONDS:-180}
      TRYON_RESULT_DIR: /app/tryon_results
      TRYON_RESULT_BASE_URL: ${TRYON_RESULT_BASE_URL:-http://localhost:8000/try-on-results}
      SPRING_INTERNAL_BASE_URL: ${SPRING_INTERNAL_BASE_URL:-http://gordi-backend:8080}
    volumes:
      - type: bind
        source: ${CATALOG_EMBEDDING_INDEX_HOST_DIR:-./ai/catalog_index}
        target: /app/catalog_index
        read_only: true
      - type: bind
        source: ${TRYON_RESULT_HOST_DIR:-./ai/tryon_results}
        target: /app/tryon_results
    networks:
      - app-network
  
  livekit:
    image: livekit/livekit-server:latest
    container_name: gordi-livekit
    restart: unless-stopped
    environment:
      # Backend의 application.properties와 동일한 API key/secret을 사용한다.
      # 루트 .env에 값이 없을 때도 두 서비스의 로컬 기본값이 일치한다.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
        keys:
          "${LIVEKIT_API_KEY:-devkey}": "${LIVEKIT_API_SECRET:-livekit-local-dev-secret-at-least-32-bytes}"
    command: --bind 0.0.0.0
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - app-network
  
  # 🚀 로컬용 Nginx 서비스 추가
  nginx:
    image: nginx:alpine
    container_name: gordi-nginx
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
      external: true

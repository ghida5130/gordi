name: ${COMPOSE_PROJECT_NAME:-gordi}-app

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gordi-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MYSQL_HOST=gordi-mysql
    networks:
      - app-network

      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gordi-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    networks:
      - app-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: gordi-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-false}
        keys:
          "${LIVEKIT_API_KEY:-devkey}": "${LIVEKIT_API_SECRET:-livekit-local-dev-secret-at-least-32-bytes}"
    command: --bind 0.0.0.0
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - app-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: gordi-ai
    restart: unless-stopped
    environment:
      ENVIRONMENT: prod
      API_PREFIX: /ai/v1
      # 컨테이너 고정 경로 (ai/.env 값보다 우선)
      CATALOG_EMBEDDING_INDEX_PATH: /app/catalog_index/catalog-embeddings.json
      TRYON_RESULT_DIR: /app/tryon_results
      # compose 네트워크 토폴로지 고정값
      SPRING_INTERNAL_BASE_URL: http://gordi-backend:8080
      RECOMMENDATION_IMAGE_ALLOWED_HOSTS: ${RECOMMENDATION_IMAGE_ALLOWED_HOSTS:-[]}
      # 파트 간 공유 값은 루트 .env 에서 관리
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # 운영 기본: 데모 비활성
      ENABLE_RECOMMENDATION_DEMO: ${ENABLE_RECOMMENDATION_DEMO:-false}
    # AI 파트 환경변수 (모델·키·플래그)는 ai/.env 에서 관리한다
    env_file:
      - path: ./ai/.env
        required: false
    volumes:
      - type: bind
        source: ${CATALOG_EMBEDDING_INDEX_HOST_DIR:-./ai/catalog_index}
        target: /app/catalog_index
        read_only: true
      - type: bind
        source: ${TRYON_RESULT_HOST_DIR:-./ai/tryon_results}
        target: /app/tryon_results
    networks:
      - app-network

networks:
  app-network:
    external: true # infra(DB/Redis)가 이미 만든 네트워크에 참여
